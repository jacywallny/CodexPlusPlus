name: Release assets

# 发版入口是推送 v* tag（本地用 `node scripts/release.mjs <版本号>`）：
#   prepare  校验版本号文件与 tag 一致，从 CHANGELOG.md 截取说明，建草稿 Release
#   构建     Windows / macOS 并行构建，附件传到草稿
#   收尾     生成 SHA256SUMS.txt 与 latest.json，附件齐了才公开发布
# 草稿期间用户看不到这一版，某个平台失败也不会让「检查更新」读到缺附件的 Latest。
# 手动在网页上发布 Release 不再触发构建；补跑某个平台用 workflow_dispatch。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "版本标签；默认必须已存在，复用已验证构建时可自动创建，例如 v2.3.1"
        required: true
        type: string
      platform:
        description: "需要重新构建的平台"
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
      publish:
        description: "Release 还是草稿时，附件与更新元数据齐备后公开发布"
        default: false
        type: boolean
      windows_build_run_id:
        description: "可选：复用本仓库已成功且完整测试的 Windows PR build 运行，免于重新编译"
        default: ""
        required: false
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_PLATFORM: ${{ inputs.platform || 'all' }}
  RELEASE_TITLE_SUFFIX: ${{ inputs.platform == 'windows' && ' — Windows x64' || '' }}

permissions:
  contents: write
  actions: read

# 同一个 tag 的两轮不要并发上传附件。
concurrency:
  group: release-assets-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft Release
    runs-on: ubuntu-latest
    outputs:
      is_draft: ${{ steps.release.outputs.is_draft }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Import tag from a verified Windows build
        if: inputs.windows_build_run_id != ''
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.windows_build_run_id }}
        with:
          script: |
            if (process.env.RELEASE_PLATFORM !== 'windows') {
              throw new Error('复用 Windows 产物时必须选择 platform=windows');
            }
            const id = process.env.SOURCE_RUN_ID;
            if (!/^[0-9]+$/.test(id)) throw new Error('无效的构建运行编号');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(id)
            });
            if (run.status !== 'completed' || run.conclusion !== 'success' ||
                run.path !== '.github/workflows/pr-build.yml' ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY) {
              throw new Error('只允许复用本仓库可信分支上成功的 PR build');
            }
            const tag = process.env.RELEASE_TAG;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag)) throw new Error('需要正式语义版本标签');
            try {
              const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              if (ref.object.type !== 'commit' || ref.object.sha !== run.head_sha) {
                throw new Error('已有标签与已验证构建不一致，禁止覆盖标签');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              // GITHUB_TOKEN 创建的标签不会再触发另一轮 push 构建。
              try {
                await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tag}`, sha: run.head_sha });
              } catch (createError) {
                if (createError.status !== 403) throw createError;
                throw new Error(`工作流令牌不能为此提交创建标签；请用维护者权限预建 ${tag} → ${run.head_sha}，再重新运行发布。无需增加仓库密钥。`);
              }
            }
            core.notice(`复用成功运行 ${id}，标签 ${tag} 指向 ${run.head_sha}`);

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify version files match tag
        # 只拦推 tag 的新发版；补跑旧 tag 时那一版可能还没有这些文件或校验脚本。
        if: github.event_name == 'push' || inputs.windows_build_run_id != ''
        run: node scripts/release-meta.mjs check "$RELEASE_TAG"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          if ! node scripts/release-meta.mjs notes "$RELEASE_TAG" > notes.md; then
            echo "::warning::CHANGELOG.md 里没有 ${RELEASE_TAG#v} 这一节，改用 GitHub 自动生成的说明"
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body > notes.md
          fi
          cat notes.md

      - name: Describe Windows release scope
        if: inputs.platform == 'windows'
        env:
          SOURCE_RUN_ID: ${{ inputs.windows_build_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' '此版本是本 fork 基于上游同版本源码发布的 Windows x64 构建，仅提供 Windows 安装包和便携包。'
            printf '%s\n\n' '旧定制分支的功能尚未逐项合入；本次不包含针对项目消失问题新增的修复，供应商切换后的项目恢复行为尚未实机验证。'
            if [ -n "$SOURCE_RUN_ID" ]; then
              printf '复用已通过完整云端测试的 EXE：[构建运行 %s](https://github.com/%s/actions/runs/%s)。正式安装包由本次发布流程重新打包，附 SHA256SUMS.txt 和 build-info.json 供核对。\n\n' "$SOURCE_RUN_ID" "$GH_REPO" "$SOURCE_RUN_ID"
            fi
            printf '%s\n\n' '### 上游更新说明'
            cat notes.md
          } > scoped-notes.md
          mv scoped-notes.md notes.md

      - name: Create or update draft Release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          case "$state" in
            missing)
              gh release create "$RELEASE_TAG" --draft --verify-tag --title "Codex++ $RELEASE_TAG$RELEASE_TITLE_SUFFIX" --notes-file notes.md
              echo "is_draft=true" >> "$GITHUB_OUTPUT"
              ;;
            true)
              # 事先手动建好的草稿：推 tag 时以 CHANGELOG 为准刷新说明；补跑时保留手改过的说明。
              if [ "$GITHUB_EVENT_NAME" = "push" ]; then
                gh release edit "$RELEASE_TAG" --tag "$RELEASE_TAG" --verify-tag --title "Codex++ $RELEASE_TAG$RELEASE_TITLE_SUFFIX" --notes-file notes.md
              fi
              echo "is_draft=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "$RELEASE_TAG 已公开发布，说明保持不动，只补附件"
              echo "is_draft=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  windows-installer:
    needs: prepare
    if: github.event_name == 'push' || inputs.platform != 'macos'
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        if: inputs.windows_build_run_id == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = $null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis -y --no-progress
            # Chocolatey 可能在下载失败后返回成功，必须实际验证编译器。
            $candidates = @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe"
            )
            $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if (-not $makensis) {
              $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
              if ($command) { $makensis = $command.Source }
            }
            if ($makensis) {
              & $makensis /VERSION
              if ($LASTEXITCODE -eq 0) { break }
            }
            $makensis = $null
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $makensis) { throw "NSIS 安装失败或编译器不可用，停止发布构建。" }

      - name: Install frontend dependencies
        if: inputs.windows_build_run_id == ''
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Build frontend
        if: inputs.windows_build_run_id == ''
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build application
        if: inputs.windows_build_run_id == ''
        run: cargo build --release

      - name: Stage Windows app files
        if: inputs.windows_build_run_id == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/codex-plus-plus.exe dist/windows/app/
          if ((Get-ChildItem dist/windows/app -Filter *.exe).Count -ne 1) { throw "Windows 安装包必须只有一个应用程序。" }

      - name: Download verified Windows binary
        if: inputs.windows_build_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: codex-plus-plus-windows-binaries
          path: dist/windows/app
          run-id: ${{ inputs.windows_build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download source build metadata
        if: inputs.windows_build_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: codex-plus-plus-windows-build-info
          path: dist/windows/source-build
          run-id: ${{ inputs.windows_build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify binary provenance and checksum
        if: inputs.windows_build_run_id != ''
        shell: pwsh
        env:
          SOURCE_RUN_ID: ${{ inputs.windows_build_run_id }}
        run: |
          $info = Get-Content -LiteralPath dist/windows/source-build/build-info.json -Raw | ConvertFrom-Json
          $version = (Get-Content -LiteralPath apps/codex-plus-manager/package.json -Raw | ConvertFrom-Json).version
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "无法读取发布标签的提交" }
          if ($info.repository -ne $env:GITHUB_REPOSITORY -or $info.runId -ne $env:SOURCE_RUN_ID -or $info.commit -ne $commit -or $info.runnerOS -ne 'Windows') {
            throw "构建来源与发布标签不一致"
          }
          if ($info.version -ne $version -or "v$version" -ne $env:RELEASE_TAG) { throw "产物版本与发布版本不一致" }
          if (-not ($info.PSObject.Properties.Name -contains 'testFilter') -or $info.testFilter -ne '') { throw "只允许发布未筛选 Rust 测试的完整构建" }
          $files = @(Get-ChildItem -LiteralPath dist/windows/app -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'codex-plus-plus.exe') { throw "产物必须只有主程序 EXE" }
          $lines = @(Get-Content -LiteralPath dist/windows/source-build/SHA256SUMS.txt | Select-String -Pattern '^([0-9a-f]{64})  codex-plus-plus\.exe$')
          if ($lines.Count -ne 1) { throw "找不到主程序的唯一 SHA-256" }
          $actual = (Get-FileHash -LiteralPath dist/windows/app/codex-plus-plus.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $lines[0].Matches[0].Groups[1].Value) { throw "主程序 SHA-256 不一致" }
          $info | Add-Member -NotePropertyName releaseTag -NotePropertyValue $env:RELEASE_TAG
          $info | Add-Member -NotePropertyName releaseRunId -NotePropertyValue $env:GITHUB_RUN_ID
          $info | Add-Member -NotePropertyName releaseWorkflowCommit -NotePropertyValue $env:GITHUB_SHA
          $info | Add-Member -NotePropertyName exeSha256 -NotePropertyValue $actual
          $info | ConvertTo-Json | Set-Content -LiteralPath dist/windows/build-info.json -Encoding utf8NoBOM
          "Verified EXE: $actual" >> $env:GITHUB_STEP_SUMMARY

      - name: Build Windows zip asset
        shell: pwsh
        run: |
          $version = ($env:RELEASE_TAG).TrimStart("v", "V")
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive -Path dist/windows/app/* -DestinationPath "dist/windows/CodexPlusPlus-$version-windows-x64.zip" -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = ($env:RELEASE_TAG).TrimStart("v", "V")
          # NSIS 的 64 位安装目录与 Chocolatey PATH 更新均需要兼容。
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $makensis) {
            $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($command) { $makensis = $command.Source }
          }
          if (-not $makensis) {
            throw "NSIS 编译器未找到，检查 Chocolatey 安装结果。"
          }
          Push-Location scripts/installer/windows
          try {
            & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" CodexPlusPlus.nsi
            if ($LASTEXITCODE -ne 0) { throw "NSIS 打包失败，退出码 $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Upload Windows installer
        # Release（含草稿）已由 prepare 建好，这里只按 tag 上传。
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" dist/windows/*.exe dist/windows/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          if [ -f dist/windows/build-info.json ]; then
            gh release upload "$RELEASE_TAG" dist/windows/build-info.json --clobber --repo "$GITHUB_REPOSITORY"
          fi

  macos-dmg:
    needs: prepare
    if: github.event_name == 'push' || inputs.platform != 'windows'
    # 单个通用包（universal）同时支持 Intel 与 Apple Silicon，
    # 用户不必再自己判断架构，Release 也只多一个而不是两个产物。
    name: macOS DMG (universal)
    # macos-14 镜像 2026-11-02 退役，期间还有计划性停机（任务分配 runner 前就被取消）。
    runs-on: macos-15
    env:
      # 与 Info.plist 的 LSMinimumSystemVersion 一致，不随 runner 的 SDK 抬高 C 依赖的最低系统版本。
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # 用临时钥匙串，不碰 runner 自带的，job 结束随机器销毁。
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign

          # 少了这一步，codesign 会弹 GUI 授权框然后挂住直到超时。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # 必须把新钥匙串加进搜索列表，否则 codesign 找不到身份。
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install Developer ID intermediate certificate
        run: |
          set -euo pipefail
          # runner 的系统钥匙串里没有 Developer ID G2 中间证书，
          # 缺了它身份会报 CSSMERR_TP_NOT_TRUSTED、find-identity 一条都列不出来。
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            -k "$RUNNER_TEMP/signing.keychain-db" -T /usr/bin/codesign

          security find-identity -v -p codesigning

      - name: Store notarization credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          xcrun notarytool store-credentials "codexplusplus-notary" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"

          rm -f "$KEY_PATH"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 通用包需要两个架构的 std，构建脚本会各编一遍再 lipo 合并。
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build universal macOS DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_PROFILE: codexplusplus-notary
        run: |
          # 发版流水线必须真的签名，凭据缺失就直接失败，不要静默退回 ad-hoc
          # 然后发一个用户打不开的包出去。
          if [ -z "${MACOS_SIGNING_IDENTITY:-}" ]; then
            echo "error: MACOS_SIGNING_IDENTITY 未配置，拒绝产出未签名的发布包" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION#V}"
          # 构建脚本自己编两个架构、lipo 合并、再调 package-dmg.sh 打包。
          bash scripts/installer/macos/build-universal.sh "$VERSION"

      - name: Verify macOS bundle structure
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -L "dist/macos/stage/Applications"
          test "$(readlink "dist/macos/stage/Applications")" = "/Applications"
          apps=(dist/macos/stage/*.app)
          test "${#apps[@]}" = "2"
          test -f "dist/macos/stage/.hidden"
          grep -qx "Codex++ 管理工具.app" "dist/macos/stage/.hidden"
          for app in "dist/macos/stage/Codex++.app" "dist/macos/stage/Codex++ 管理工具.app"; do
            test -f "$app/Contents/Info.plist"
            test -f "$app/Contents/PkgInfo"
            test -x "$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            if [[ "$app" == *"管理工具.app" ]]; then
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.bigpizzav3.codexplusplus.manager"
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = "CodexPlusPlusManager"
            else
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.bigpizzav3.codexplusplus"
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = "CodexPlusPlus"
            fi
            test "$(/usr/libexec/PlistBuddy -c 'Print :CodexPlusUnifiedApp' "$app/Contents/Info.plist")" = "true"
            plutil -lint "$app/Contents/Info.plist" >/dev/null
            codesign -dv "$app" >/dev/null 2>&1
            # 真签名时额外校验签名有效性与 Gatekeeper 判定，防止"签了但无效"混过去。
            if [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
              codesign --verify --deep --strict "$app"
              spctl --assess --type execute "$app"
            fi
            echo "verified: $app"
          done

      - name: Verify DMG notarization
        # 不加 if 条件：Build macOS DMG 已在凭据缺失时直接失败，
        # 能走到这里就必然签名并公证过。此前用 if: env.MACOS_SIGNING_IDENTITY
        # 判断，但该变量只存在于上一步的 env 里，这一步读不到，会永远跳过。
        run: |
          set -euo pipefail
          for dmg in dist/macos/*.dmg; do
            xcrun stapler validate "$dmg"
            echo "notarized: $dmg"
          done

      - name: Upload macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/macos/*.dmg --clobber --repo "$GITHUB_REPOSITORY"

  latest-json:
    name: Upload checksums, latest.json and publish
    # 单平台补跑时另一个 job 会跳过；成功或跳过才允许更新元数据。
    if: always() && needs.prepare.result == 'success' && (needs.windows-installer.result == 'success' || needs.windows-installer.result == 'skipped') && (needs.macos-dmg.result == 'success' || needs.macos-dmg.result == 'skipped')
    runs-on: ubuntu-latest
    needs:
      - prepare
      - windows-installer
      - macos-dmg
    steps:
      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # 按 Release 上现有的全部安装包重算，单平台补跑后也是完整清单。
          gh release download "$TAG" --repo "$REPO" --pattern 'CodexPlusPlus-*' --dir assets --clobber
          (cd assets && sha256sum CodexPlusPlus-* | sort -k2 > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$REPO"

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets,body,tagName,url > release.json
          node <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const repo = process.env.REPO;
          const tag = release.tagName || process.env.TAG;
          const version = tag.replace(/^v/i, "");
          const required = [
            "CodexPlusPlus-" + version + "-windows-x64-setup.exe",
            "CodexPlusPlus-" + version + "-windows-x64.zip"
          ];
          if (process.env.RELEASE_PLATFORM !== "windows") {
            required.push("CodexPlusPlus-" + version + "-macos-universal.dmg");
          }
          required.push("SHA256SUMS.txt");
          for (const name of required) {
            if (!(release.assets || []).some((asset) => asset.name === name && asset.size > 0)) {
              throw new Error("发布附件缺失或为空：" + name);
            }
          }
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;
          const assets = (release.assets || [])
            .map((asset) => asset.name)
            .filter((name) => name !== "latest.json")
            .map((name) => ({ name, url: `${baseUrl}/${encodeURIComponent(name)}` }));
          const payload = {
            version: `v${version}`,
            // 草稿的 release.url 是临时 untagged 地址，静态元数据必须使用正式 tag 链接。
            url: `https://github.com/${repo}/releases/tag/${tag}`,
            body: release.body || "",
            assets
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          cat latest.json

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "$TAG" latest.json --clobber --repo "$REPO"

      - name: Publish Release
        # 默认仍要求双平台成功；显式选 Windows 时只发布已校验齐全的 Windows 附件。
        if: needs.prepare.outputs.is_draft == 'true' && (github.event_name == 'push' || inputs.publish) && needs.windows-installer.result == 'success' && (needs.macos-dmg.result == 'success' || inputs.platform == 'windows')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # 只有版本最新时才标 Latest：补发的旧版本不能抢走 Latest，
          # 否则「检查更新」读 releases/latest/download/latest.json 会回退到旧版。
          published=$(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName -q '.[].tagName')
          newest=$(printf '%s\n' "$TAG" $published | sed 's/^[vV]//' | sort -V | tail -n 1)
          if [ "$newest" = "${TAG#[vV]}" ]; then
            latest=true
          else
            latest=false
            echo "::notice::已有更新的 v$newest，$TAG 发布但不标 Latest"
          fi
          gh release edit "$TAG" --draft=false --latest="$latest" --verify-tag --repo "$REPO"
